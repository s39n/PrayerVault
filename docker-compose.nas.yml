# NAS deployment via Dockhand git stack (or docker compose with -e vars set).
# All values come from the Dockhand "Environment variables" panel via ${VAR}
# interpolation — no .env file needed. Required vars error out with a hint.
#
# Prereq: the NAS Docker daemon must be able to pull the private image —
# add ghcr.io credentials in Dockhand's registry settings, or run:
#   docker login ghcr.io -u s39n -p <PAT with read:packages>

services:
  prayervault:
    image: ghcr.io/s39n/prayervault:latest
    restart: unless-stopped
    environment:
      - VAULT_DIR=/vault
      - AUTH_USERNAME=${AUTH_USERNAME:-sean}
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH:?generate with scripts/hash_password.py}
      - SESSION_SECRET=${SESSION_SECRET:?generate with python -c "import secrets; print(secrets.token_hex(32))"}
      - OLLAMA_URL=${OLLAMA_URL:?e.g. http://10.0.0.210:11434 - no /v1 suffix}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
    volumes:
      - "${PRAYERS_DIR:?host folder where prayer notes are stored}:/vault"

  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:?public domain, e.g. pray.safile.us} --to prayervault:8000
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
