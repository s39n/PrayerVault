<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrayerVault</title>
<style>
:root{--bg:#efe7d6;--bg2:#f5efe1;--card:#fffdf7;--ink:#2f2a22;--muted:#8a8172;--accent:#5b6e58;--accent-dark:#46543f;--gold:#a9843c;--line:#e6ddca;--danger:#9c4a3c}
*{box-sizing:border-box}
body{
  margin:0;color:var(--ink);line-height:1.6;
  font-family:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif;
  background:
    radial-gradient(120% 80% at 15% 0%, rgba(255,252,244,.9) 0%, rgba(255,252,244,0) 45%),
    radial-gradient(120% 90% at 85% 12%, rgba(255,249,236,.85) 0%, rgba(255,249,236,0) 40%),
    radial-gradient(150% 120% at 50% 115%, rgba(216,199,166,.55) 0%, rgba(216,199,166,0) 55%),
    linear-gradient(180deg, var(--bg2) 0%, var(--bg) 100%);
  background-attachment:fixed;min-height:100vh;
}
header{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;background:transparent}
header h1{font-size:1.15rem;margin:0;font-weight:normal;letter-spacing:2px;text-transform:uppercase;color:var(--accent-dark)}
header h1 em{color:var(--gold);font-style:italic;letter-spacing:1px;text-transform:none}
main{max-width:760px;margin:0 auto;padding:12px 20px 60px}
button{font-family:inherit;font-size:.95rem;border:1px solid var(--line);background:rgba(255,255,255,.55);color:var(--ink);padding:9px 16px;border-radius:24px;cursor:pointer;transition:background .2s,border-color .2s}
button:hover{border-color:var(--gold)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark)}
button.link{border:none;background:none;color:var(--accent);padding:4px;border-radius:0}
button.link:hover{color:var(--gold)}
input,textarea,select{font-family:inherit;font-size:1rem;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.75);color:var(--ink)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
textarea{min-height:140px;resize:vertical}
label{display:block;margin:12px 0 4px;color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:1.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:16px;box-shadow:0 6px 24px rgba(120,100,60,.06)}
.card.clickable{transition:box-shadow .2s,transform .15s}
.card.clickable:hover{box-shadow:0 10px 30px rgba(120,100,60,.13);transform:translateY(-1px);cursor:pointer}
.hero{background:linear-gradient(180deg,rgba(255,253,247,.9),rgba(250,244,231,.9));border:1px solid var(--line);border-radius:20px;padding:30px 26px;margin-bottom:22px;box-shadow:0 10px 34px rgba(120,100,60,.1)}
.hero .eyebrow{color:var(--gold)}
.hero h2{font-size:1.9rem;line-height:1.25;margin:8px 0 10px;font-weight:normal;letter-spacing:.2px}
.hero p{color:var(--muted);margin:0 0 18px;font-style:italic}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:2.5px;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:24px;padding:5px 15px;font-size:.82rem;background:rgba(255,255,255,.5);cursor:pointer;color:var(--muted);letter-spacing:.5px}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.badge{font-size:.72rem;padding:3px 11px;border-radius:12px;background:var(--line);color:var(--muted);letter-spacing:.5px}
.badge.answered{background:#dfe8d9;color:var(--accent-dark)}
.badge.pending{background:#f3e8cf;color:var(--gold)}
.badge.error{background:#f0d9d3;color:var(--danger)}
.meta{color:var(--muted);font-size:.85rem}
.section-title{color:var(--gold);font-size:.72rem;text-transform:uppercase;letter-spacing:2.5px;margin:22px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.scripture-ref{color:var(--gold);font-weight:bold}
#login-view{max-width:380px;margin:12vh auto}
.error-msg{color:var(--danger);font-size:.9rem;min-height:1.2em;margin-top:8px}
.hidden{display:none}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
blockquote{border-left:3px solid var(--gold);margin:8px 0;padding:2px 14px;color:var(--muted);font-style:italic}
ul{padding-left:22px}
.verse-quote{white-space:pre-wrap}
nav#nav{display:flex;gap:8px;justify-content:center;padding:4px 20px 2px;flex-wrap:wrap}
.nav-item{border:none;background:none;color:var(--muted);border-radius:0;padding:6px 14px 10px;font-size:.95rem;letter-spacing:.5px;border-bottom:2px solid transparent}
.nav-item:hover{color:var(--accent-dark);border-color:var(--line)}
.nav-item.active{color:var(--accent-dark);border-color:var(--gold)}
.greeting{text-align:center;margin:18px 0 24px}
.greeting .eyebrow{display:block;margin-bottom:6px}
.greeting h2{font-size:1.7rem;font-weight:normal;margin:0}
.verse-card{background:linear-gradient(180deg,rgba(255,253,247,.95),rgba(249,242,228,.95));border:1px solid var(--line);border-radius:20px;padding:26px;margin-bottom:22px;text-align:center;box-shadow:0 8px 28px rgba(120,100,60,.08)}
.verse-card .verse-text{font-size:1.25rem;line-height:1.5;font-style:italic;color:var(--ink);margin:6px 0 12px}
.verse-card .verse-ref{color:var(--gold);letter-spacing:1px;font-size:.9rem}
.next-step{text-align:center;color:var(--muted);font-style:italic;margin:18px 0}
.fruit-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.fruit-card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:14px;padding:18px;box-shadow:0 6px 24px rgba(120,100,60,.06);transition:box-shadow .2s,transform .15s;cursor:pointer}
.fruit-card:hover{box-shadow:0 10px 30px rgba(120,100,60,.13);transform:translateY(-1px)}
.fruit-card h3{font-size:1.1rem;font-weight:normal;margin:0 0 4px}
.fruit-card .answered-on{color:var(--gold);font-size:.78rem;text-transform:uppercase;letter-spacing:1.5px}
.veil{position:fixed;top:64px;height:calc(100vh - 64px);width:clamp(0px,calc((100vw - 880px) * 0.375),105px);z-index:0;pointer-events:none;overflow:hidden}
.veil-left{left:0}
.veil-right{right:0}
.veil-fabric{position:absolute;top:0;height:106%;width:100%;background-color:#7a1c1c;background-size:100% 100%,3px 3px,3px 3px;will-change:transform;backface-visibility:hidden}

0%, 83.58% 85.83%, 83.27% 86.67%, 84.57% 87.50%, 85.67% 88.33%, 84.40% 89.17%, 84.83% 90.00%, 84.41% 90.83%, 83.32% 91.67%, 84.58% 92.50%, 85.53% 93.33%, 85.48% 94.17%, 85.57% 95.00%, 88.09% 95.83%, 85.30% 96.67%, 85.95% 97.50%, 85.80% 98.33%, 86.23% 99.17%, 87.80% 100.00%, 0% 100%)}
.veil-right .veil-fabric{background-image:linear-gradient(90deg,rgba(0,0,0,.5) 0%,rgba(255,255,255,.09) 12%,rgba(0,0,0,.44) 28%,rgba(255,255,255,.13) 45%,rgba(0,0,0,.4) 63%,rgba(255,255,255,.1) 80%,rgba(0,0,0,.48) 100%),repeating-linear-gradient(0deg,transparent 0 2px,rgba(0,0,0,.06) 2px 3px),repeating-linear-gradient(90deg,transparent 0 2px,rgba(0,0,0,.05) 2px 3px);transform-origin:right center;animation:swayR 7.5s ease-in-out infinite;animation-delay:-2.5s;clip-path:polygon(100% 0%, 100% 100%, 18.80% 100.00%, 18.18% 99.17%, 20.05% 98.33%, 18.06% 97.50%, 18.83% 96.67%, 18.15% 95.83%, 18.28% 95.00%, 20.11% 94.17%, 16.75% 93.33%, 17.70% 92.50%, 16.58% 91.67%, 16.66% 90.83%, 18.59% 90.00%, 15.73% 89.17%, 16.25% 88.33%, 15.06% 87.50%, 15.64% 86.67%, 14.06% 85.83%, 12.48% 85.00%, 12.83% 84.17%, 12.12% 83.33%, 12.89% 82.50%, 11.45% 81.67%, 9.52% 80.83%, 10.63% 80.00%, 8.69% 79.17%, 8.88% 78.33%, 7.27% 77.50%, 7.43% 76.67%, 8.27% 75.83%, 6.82% 75.00%, 7.23% 74.17%, 6.84% 73.33%, 5.86% 72.50%, 5.73% 71.67%, 4.54% 70.83%, 5.08% 70.00%, 5.44% 69.17%, 2.82% 68.33%, 5.69% 67.50%, 3.53% 66.67%, 2.64% 65.83%, 2.65% 65.00%, 3.33% 64.17%, 2.37% 63.33%, 3.60% 62.50%, 3.74% 61.67%, 4.69% 60.83%, 4.11% 60.00%, 5.92% 59.17%, 5.04% 58.33%, 3.95% 57.50%, 6.08% 56.67%, 5.57% 55.83%, 6.66% 55.00%, 5.93% 54.17%, 6.86% 53.33%, 4.20% 52.50%, 4.53% 51.67%, 7.08% 50.83%, 3.68% 50.00%, 6.93% 49.17%, 6.87% 48.33%, 4.04% 47.50%, 4.02% 46.67%, 6.68% 45.83%, 6.73% 45.00%, 6.27% 44.17%, 5.59% 43.33%, 5.54% 42.50%, 3.72% 41.67%, 2.43% 40.83%, 4.44% 40.00%, 5.13% 39.17%, 5.14% 38.33%, 3.34% 37.50%, 1.29% 36.67%, 1.66% 35.83%, 2.43% 35.00%, 1.44% 34.17%, 0.53% 33.33%, 0.95% 32.50%, 1.92% 31.67%, 0.47% 30.83%, 0.40% 30.00%, 0.48% 29.17%, 0.40% 28.33%, 2.72% 27.50%, 3.08% 26.67%, 0.81% 25.83%, 2.52% 25.00%, 3.59% 24.17%, 1.55% 23.33%, 2.16% 22.50%, 4.46% 21.67%, 4.41% 20.83%, 4.31% 20.00%, 5.39% 19.17%, 5.08% 18.33%, 4.67% 17.50%, 6.56% 16.67%, 7.49% 15.83%, 5.47% 15.00%, 7.05% 14.17%, 7.58% 13.33%, 10.36% 12.50%, 8.86% 11.67%, 10.90% 10.83%, 10.69% 10.00%, 11.12% 9.17%, 12.19% 8.33%, 14.22% 7.50%, 13.96% 6.67%, 13.56% 5.83%, 13.23% 5.00%, 14.43% 4.17%, 15.35% 3.33%, 16.41% 2.50%, 18.06% 1.67%, 15.98% 0.83%, 18.49% 0.00%)}
@keyframes swayL{0%,100%{transform:perspective(1000px) rotateY(0deg) skewX(0deg)}28%{transform:perspective(1000px) rotateY(6.5deg) skewX(-0.9deg)}52%{transform:perspective(1000px) rotateY(9.5deg) skewX(-1.5deg)}76%{transform:perspective(1000px) rotateY(4.5deg) skewX(-0.7deg)}}
@keyframes swayR{0%,100%{transform:perspective(1000px) rotateY(0deg) skewX(0deg)}32%{transform:perspective(1000px) rotateY(-7deg) skewX(1deg)}56%{transform:perspective(1000px) rotateY(-9.5deg) skewX(1.5deg)}80%{transform:perspective(1000px) rotateY(-4deg) skewX(0.6deg)}}
@media (prefers-reduced-motion:reduce){.veil-fabric{animation:none!important}}
header,nav#nav,main{position:relative;z-index:1}
@media (max-width:900px){.veil{display:none}}
</style>
</head>
<body>
<div class="veil veil-left" aria-hidden="true"><div class="veil-fabric"></div></div>
<div class="veil veil-right" aria-hidden="true"><div class="veil-fabric"></div></div>
<header>
  <h1>Prayer<em>Vault</em></h1>
  <div id="header-actions" class="hidden">
    <button id="btn-new" class="primary">+ New Prayer</button>
    <button id="btn-logout" class="link">Sign out</button>
  </div>
</header>
<nav id="nav" class="hidden">
  <button class="nav-item" data-nav="today">Today</button>
  <button class="nav-item" data-nav="prayers">Prayers</button>
  <button class="nav-item" data-nav="fruit">Fruit</button>
  <button class="nav-item" data-nav="ask">Ask</button>
  <button class="nav-item" data-nav="you">You</button>
</nav>
<main>
  <div id="login-view" class="card hidden">
    <h2 style="margin-top:0;font-weight:normal">Sign in</h2>
    <p class="meta" style="margin-top:-8px">“Cast your burden on the Lord, and he will sustain you.” — Ps 55:22</p>
    <label>Username</label><input id="login-user" autocomplete="username">
    <label>Password</label><input id="login-pass" type="password" autocomplete="current-password">
    <div class="error-msg" id="login-error"></div>
    <button id="btn-login" class="primary" style="width:100%;margin-top:6px">Sign in</button>
  </div>
  <div id="today-view" class="hidden"></div>
  <div id="list-view" class="hidden"></div>
  <div id="fruit-view" class="hidden"></div>
  <div id="ask-view" class="hidden"></div>
  <div id="you-view" class="hidden"></div>
  <div id="detail-view" class="hidden"></div>
  <div id="new-view" class="hidden"></div>
</main>
<script src="/app.js"></script>
</body>
</html>
