# Dockhand / NAS stack — no .env file, no Caddyfile needed.
# Set all variables in Dockhand's Environment panel (see README "Deploying on a NAS").
# Prereq on the NAS: docker login ghcr.io -u s39n -p <PAT with read:packages>

services:
  prayervault:
    image: ghcr.io/s39n/prayervault:latest
    restart: unless-stopped
    environment:
      - VAULT_DIR=/vault
      - AUTH_USERNAME=${AUTH_USERNAME}
      - AUTH_PASSWORD_HASH=${AUTH_PASSWORD_HASH}
      - SESSION_SECRET=${SESSION_SECRET}
      - OLLAMA_URL=${OLLAMA_URL}
      - OLLAMA_MODEL=${OLLAMA_MODEL}
      - COOKIE_SECURE=true
    volumes:
      - "${PRAYERS_DIR}:/vault"

  caddy:
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN} --to prayervault:8000
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
