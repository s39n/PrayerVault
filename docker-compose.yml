services:
  prayervault:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - VAULT_DIR=/vault
    volumes:
      - "${PRAYERS_DIR}:/vault"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # For LAN-only use without Caddy, uncomment and set COOKIE_SECURE=false in .env:
    # ports:
    #   - "8800:8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
